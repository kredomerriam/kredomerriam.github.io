<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/css-position.css">
    <title>POSITION AND DISPLAY</title>
</head>
<body>
    <header>
        <h1>Z-Index</h1>
        <div class="box red"></div>
        <div class="box green"></div>
        <div class="box blue"></div>
    </header>
<hr>
    <h1>CSS POSITIONS</h1>
    <div class="static">
        <h2>STATIC</h2>
    </div>
    <div class="relative">
        <h2>RELATIVE</h2>
    </div>
    <div class="absolute">
        <h2>ABSOLUTE</h2>
    </div>
    <div class="fixed">
        <h2>FIXED</h2>
    </div>
<hr>

    <h1>DISPLAY ELEMENTS</h1>
    <span class="block">BLOCK DISPLAY</span>
    <p class="inline">INLINE DISPLAY</p>
    <div class="inline-block">INLINE-BLOCK DISPLAY</div>
    <span>random span</span>
</body>
</html>
